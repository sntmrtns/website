<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nosnippet">
  <title>Saint Martins</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@600&amp;display=swap">
  <link rel="stylesheet" href="style.css?v=34">
  <script src="main.js?v=21" defer></script>
  <noscript><style>body{opacity:1;animation:none}.image-container .noscript-logo{display:block}</style></noscript>
</head>
<body>
  <div class="zoom-wrap">
    <div class="page-container">
      <div class="image-container">
        <img id="logo" alt="Saint Martins">
        <noscript><img class="noscript-logo" src="logos/logo-1.svg?v=2" alt="Saint Martins"></noscript>
      </div>
      <div class="page-footer">
        <span id="timer"></span>
        <span id="date"></span>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const wrap = document.querySelector('.zoom-wrap');
      const phone = matchMedia('(max-width:768px) and (pointer:coarse)');
      const fit = () => { wrap.style.zoom = phone.matches ? '' : window.innerWidth / 2560; };
      fit();
      window.addEventListener('resize', fit);
    })();
  </script>
</body>
</html>
