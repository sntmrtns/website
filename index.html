<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="dark">
	<title>Saint Martins</title>
	<meta name="robots" content="noindex, nosnippet">
	<link rel="icon" type="image/png" href="/favicon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@600&amp;display=swap">
	<link rel="stylesheet" href="style.css?v=33">
	<noscript><style>body{opacity:1;animation:none}.image-container .noscript-logo{display:block}</style></noscript>
</head>
<body>
	<div class="zoom-wrap">
		<div class="page-container">
			<div class="image-container">
				<img id="logo" alt="Saint Martins">
					<noscript><img class="noscript-logo" src="logo1.svg?v=2" alt="Saint Martins"></noscript>
			</div>
			<div class="page-footer">
				<div class="page-footer-timer">
					<span id="timer" class="page-footer-timer-text"></span>
					<span id="date" class="page-footer-timer-text"></span>
				</div>
			</div>
		</div>
	</div>
	<script>(function(){const zw=document.querySelector('.zoom-wrap');if(!zw)return;const mob=()=>window.matchMedia('(max-width:768px) and (pointer:coarse)').matches;function sz(){zw.style.zoom=mob()?'':window.innerWidth/2560;}sz();window.addEventListener('resize',sz);})();</script>
	<script src="script.js?v=19" defer></script>
</body>
</html>
